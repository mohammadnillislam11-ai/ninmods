apply plugin: 'com.android.application'

def getVersionProp(String name, String defaultVal) {
    def f = file("src/main/res/values/version.xml")
    if (f.exists()) {
        def matcher = f.text =~ /<string name="${name}">([^<]+)<\/string>/
        if (matcher.find()) {
            return matcher.group(1).trim()
        }
    }
    return defaultVal
}

android {
    compileSdkVersion 34

    namespace 'com.ninmods.main'

    defaultConfig {
        applicationId "com.ninmods.main"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode getVersionProp("version_code", "994").toInteger()
        versionName getVersionProp("app_version", "90.94")

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def libsuVersion = '3.0.0'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:service:${libsuVersion}"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core:1.6.0'
}

configurations.all {
    exclude group: 'com.itsaky.androidide', module: 'logsender'
}
