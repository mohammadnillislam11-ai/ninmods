name: Build Main App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 ndk;21.4.7075529'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          ./gradlew assembleDebug

      - name: Sign & Align APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias ninmods -keyalg RSA -keysize 2048 -validity 10000 -storepass ninmods123 -keypass ninmods123 -dname "CN=NINMODS, OU=Mobile, O=NIN, L=Dhaka, S=Dhaka, C=BD"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -p -f 4 app/build/outputs/apk/debug/app-debug.apk main_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:ninmods123 --key-pass pass:ninmods123 --v4-signing-enabled false --out "Main_V49.apk" main_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "Main_V49.apk"

      - name: Fetch Latest Loader APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p loader_tmp
          gh release download --repo mohammadnillislam11-ai/ninmods-kernel-builder --pattern "NINMODS_Driver_Loader.apk" --dir loader_tmp 2>/dev/null && cp loader_tmp/NINMODS_Driver_Loader.apk Loader_V45.apk || curl -sL --fail "https://github.com/mohammadnillislam11-ai/ninmods-kernel-builder/releases/latest/download/NINMODS_Driver_Loader.apk" -o "Loader_V45.apk" || echo "Loader download fallback"
          ls -la *.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Release-APKs
          path: |
            Main_V49.apk
            Loader_V45.apk

      - name: Create GitHub Release and Upload Both APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up all older releases..."
          for old_tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            echo "Deleting old release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

          RELEASE_TAG="v49.0-$(date +'%Y%m%d%H%M%S')"
          ASSETS="Main_V49.apk"
          if [ -f "Loader_V45.apk" ]; then
            ASSETS="Main_V49.apk Loader_V45.apk"
          fi
          gh release create "$RELEASE_TAG" \
            $ASSETS \
            --title "Release $RELEASE_TAG" \
            --notes "Release bundle $RELEASE_TAG"
