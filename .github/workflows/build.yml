name: Build Main App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 ndk;21.4.7075529'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          ./gradlew assembleDebug

      - name: Sign & Align APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias ninmods -keyalg RSA -keysize 2048 -validity 10000 -storepass ninmods123 -keypass ninmods123 -dname "CN=NINMODS, OU=Mobile, O=NIN, L=Dhaka, S=Dhaka, C=BD"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -p -f 4 app/build/outputs/apk/debug/app-debug.apk main_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:ninmods123 --key-pass pass:ninmods123 --v4-signing-enabled false --out "Main_V43.apk" main_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "Main_V43.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Main-App-V43
          path: Main_V43.apk
