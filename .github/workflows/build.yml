name: Build Main App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 ndk;24.0.8215888'

      - name: Build Native Libraries & Gradle APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/24.0.8215888" >> local.properties

          # Step 1: Compile shared library (libninmods.so) and root daemon (ninlite) via ndk-build
          $ANDROID_HOME/ndk/24.0.8215888/ndk-build -C app/src/main/jni APP_ABI=arm64-v8a

          # Step 2: Package ninlite executable as libninlite.so into jniLibs and assets
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          DAEMON_ARM64=$(find app/ -type f -name "ninlite" | grep "arm64" | head -n 1)
          if [ -n "$DAEMON_ARM64" ]; then
            echo "Packaging arm64 ninlite from: $DAEMON_ARM64"
            cp -f "$DAEMON_ARM64" app/src/main/jniLibs/arm64-v8a/libninlite.so
            cp -f "$DAEMON_ARM64" app/src/main/assets/ninlite
          else
            echo "ERROR: ninlite not found for arm64-v8a"
            find app/ -name "*ninlite*" || true
            exit 1
          fi

          # Step 3: Build APK with Gradle (externalNativeBuild runs ndk-build for shared libs)
          ./gradlew assembleDebug --stacktrace

      - name: Sign & Align APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Must stay in sync with SecurityVault_ExpectedCertDigest() in
          # app/src/main/jni/src/Includes/NativeCrypto.h
          EXPECTED_CERT_SHA256: 46f9c3598550d9a66915913d38d1229585f661c14c3179900ba49839faac984e
        run: |
          APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          echo "Found APK at: $APK_SRC"
          APP_VER=$(grep '<string name="app_version">' app/src/main/res/values/version.xml | sed -E 's/.*<string name="app_version">([^<]+)<\/string>.*/\1/' | tr -d ' \r\n')
          if [ -z "$APP_VER" ]; then
            echo "::error::Canonical version.xml is missing app_version"
            exit 1
          fi
          echo "Building Main_V${APP_VER}.apk"
          KS_PASS="${RELEASE_KEYSTORE_PASSWORD:-ninmods123}"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-ninmods}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$KS_PASS}"
          if [ ! -f "release.keystore" ]; then
            echo "Generating release.keystore..."
            keytool -genkey -v -keystore release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=NINMODS, OU=Mobile, O=NIN, L=Dhaka, S=Dhaka, C=BD"
          fi
          $ANDROID_HOME/build-tools/34.0.0/zipalign -p -f 4 "$APK_SRC" main_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" --v4-signing-enabled false --out "Main_V${APP_VER}.apk" main_aligned.apk
          find . -name "*.idsig" -delete
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "Main_V${APP_VER}.apk"

      - name: Fetch Latest Loader APK (Preserve Original Version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p loader_tmp
          gh release download --repo mohammadnillislam11-ai/ninmods-kernel-builder --pattern "Loader_V*.apk" --dir loader_tmp 2>/dev/null || echo "Loader download fallback"
          LOADER_FILE=$(find loader_tmp -type f -name "Loader_V*.apk" | head -n 1)
          if [ -n "$LOADER_FILE" ]; then
            # Copy keeping its original filename and version intact
            cp -f "$LOADER_FILE" "./"
          fi
          ls -la *.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Release-APKs
          path: "*.apk"

      - name: Create GitHub Release and Upload APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(grep '<string name="app_version">' app/src/main/res/values/version.xml | sed -E 's/.*<string name="app_version">([^<]+)<\/string>.*/\1/' | tr -d ' \r\n')
          if [ -z "$APP_VER" ]; then
            echo "::error::Canonical version.xml is missing app_version"
            exit 1
          fi
          echo "Cleaning up all older releases..."
          for old_tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            echo "Deleting old release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

          RELEASE_TAG="V${APP_VER}-$(date +'%Y%m%d%H%M%S')"
          ASSETS=$(find . -maxdepth 1 -type f -name "*.apk")
          gh release create "$RELEASE_TAG" \
            $ASSETS \
            --title "Main V${APP_VER}" \
            --notes "NINMODS Main App V${APP_VER} (100% Kernel Driver Architecture)"
